<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#0f1418"/>
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f3640"/>
      <stop offset="50%" stop-color="#718093"/>
      <stop offset="100%" stop-color="#1e272e"/>
    </linearGradient>
    <linearGradient id="ringSafe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#01a3a4"/>
    </linearGradient>
    <linearGradient id="ringDeadly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5253"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="60%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#e17055"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>

  <!-- Central Column -->
  <rect x="114" y="24" width="28" height="208" rx="8" fill="url(#poleGrad)"/>

  <!-- Upper Ring (Flattened ellipse) -->
  <ellipse cx="128" cy="80" rx="72" ry="24" fill="none" stroke="url(#ringSafe)" stroke-width="18" stroke-dasharray="280 80"/>

  <!-- Middle Ring -->
  <ellipse cx="128" cy="140" rx="72" ry="24" fill="none" stroke="url(#ringDeadly)" stroke-width="18" stroke-dasharray="140 60 100 60"/>

  <!-- Lower Ring -->
  <ellipse cx="128" cy="200" rx="72" ry="24" fill="none" stroke="url(#ringSafe)" stroke-width="18" stroke-dasharray="200 160"/>

  <!-- The Ball -->
  <ellipse cx="128" cy="104" rx="14" ry="7" fill="rgba(0,0,0,0.3)"/>
  <circle cx="128" cy="98" r="14" fill="url(#ballGrad)"/>
</svg>
